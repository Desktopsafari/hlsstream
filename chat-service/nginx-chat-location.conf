# Add this location block inside the existing HTTPS (443) server block for
# stream.desktopsafari.com in /etc/nginx/sites-enabled/stream.conf on the
# VPS, alongside the existing /hls location. Reuses the same domain/TLS
# cert -- no new subdomain or DNS record needed.

location /chat {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Socket.IO connections are long-lived; don't let nginx time them out.
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}
