# Goes inside the existing HTTPS (443) server block for
# stream.desktopsafari.com in /etc/nginx/sites-enabled/stream.conf, next to
# /hls and /chat (add-capture-nginx.sh inserts it). Same domain and TLS cert.
# Nothing in the rtmp {} block changes.

# The capture service's API. Only the website's servers call it, with the
# shared secret header; the service itself refuses everything else.
location /capture-api/ {
    proxy_pass http://127.0.0.1:3002/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    client_max_body_size 16k;
    proxy_read_timeout 90s;
}

# Finished captures, served straight from disk. The names are 128-bit random,
# so a file is only reachable by someone who was given its link. Not logged,
# like /hls. CORS lets the site fetch a file for the Share button.
location ~ "^/captures/f/([A-Za-z0-9_-]{22}(-t)?\.(jpg|mp4))$" {
    access_log off;
    alias /var/lib/capture/files/$1;
    add_header Cache-Control "private, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "*" always;
}

# The same files as a download (Content-Disposition: attachment).
location ~ "^/captures/dl/([A-Za-z0-9_-]{22}\.(jpg|mp4))$" {
    access_log off;
    alias /var/lib/capture/files/$1;
    add_header Content-Disposition "attachment; filename=\"desktopsafari-$1\"" always;
    add_header Cache-Control "private, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
}
